<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DesktopPet</title>
  </head>
  <body class="overlay floating-ball-body">
    <!-- The ball fills the entire small square window so there are no
         transparent gaps for Windows click-through to eat mouse events. -->
    <div id="ball" class="ball" title="">
      <canvas id="ball-pet" width="64" height="64"></canvas>
    </div>

    <!-- Left-click menu: type a message or pick from presets, choose target. -->
    <div id="ball-menu" class="ball-menu" hidden>
      <div class="bm-head">
        <span class="bm-title">✦ <span id="bm-title-text">Quick bubble</span></span>
        <span class="bm-hint" id="bm-hint">Shift-click to remove</span>
      </div>
      <input id="bm-input" type="text" maxlength="120" autocomplete="off"
             placeholder="Type a bubble message…" />
      <div class="bm-presets" id="bm-presets"></div>
      <div class="bm-foot">
        <button class="linklike" id="bm-cancel">Cancel</button>
        <button class="prominent" id="bm-send" disabled>Send</button>
      </div>
    </div>

    <script type="module" src="/src/floating-ball.ts"></script>
  </body>
</html>
